# XcodeGen spec — run `xcodegen generate` to produce REmu.xcodeproj
# Install: brew install xcodegen

name: REmu
options:
  bundleIdPrefix: com.fatihkoca
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  # Base language is English; Resources/en.lproj + tr.lproj supply the
  # Localizable.strings tables. XcodeGen auto-detects the .lproj folders
  # under the Resources path and registers en + tr as known regions.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.2.0

targets:
  REmu:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          # The raw .dylib cores here are the SOURCE that make-core-frameworks.sh
          # wraps into CoreFrameworks/*.framework. They must NOT be copied into
          # the app as loose files — Apple rejects standalone .dylib files
          # (error 90171). They reach the app only as embedded frameworks (see
          # the framework dependencies below), so exclude the raw folder.
          - "Cores/**"
    resources:
      - path: Resources
        excludes:
          - "Cores/**"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: REmu
        CFBundleShortVersionString: "1.6.0"
        CFBundleVersion: "13"
        # 10-language UI. Declaring them here makes the App Store list the app
        # as available in each language and pins the base (development) language.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - tr
          - es
          - de
          - fr
          - ja
          - zh-Hans
          - hi
          - pt-BR
          - ru
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # No UIBackgroundModes — when the user backgrounds the app we want
        # iOS to auto-pause our AVAudioSession so the speaker stops cleanly.
        # Previously declaring "audio" kept the engine running and the user
        # heard the game music continue until they killed the app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: "ROM File"
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.item
        UIApplicationSupportsIndirectInputEvents: true
        # Declares that REmu uses no proprietary or non-exempt encryption.
        # Without this key, every TestFlight upload pops a dialog asking
        # the same question. Setting it to false here skips the prompt
        # and is honest: REmu only uses Apple's HTTPS for the optional
        # cover-art lookup, which falls under Apple's standard exemption.
        ITSAppUsesNonExemptEncryption: false
        # --- AdMob (REmu'nun gerçek App ID'si) ---
        GADApplicationIdentifier: "ca-app-pub-9552777744655142~6307775080"
        NSUserTrackingUsageDescription: "Your data will be used to deliver more relevant ads to you."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
