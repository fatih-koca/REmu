# XcodeGen spec — run `xcodegen generate` to produce REmu.xcodeproj
# Install: brew install xcodegen

name: REmu
options:
  bundleIdPrefix: com.fatihkoca
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"

targets:
  REmu:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          # Cores are embedded into Frameworks/ via the post-build script
          # below, NOT copied as plain resources — that path lets us code-sign
          # them with the app's identity so iOS will dlopen them at runtime.
          - "Cores/**"
    resources:
      - path: Resources
        excludes:
          - "Cores/**"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: REmu
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # No UIBackgroundModes — when the user backgrounds the app we want
        # iOS to auto-pause our AVAudioSession so the speaker stops cleanly.
        # Previously declaring "audio" kept the engine running and the user
        # heard the game music continue until they killed the app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: "ROM File"
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.item
        UIApplicationSupportsIndirectInputEvents: true
    entitlements:
      path: Resources/REmu.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatihkoca.REmu2026
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/RetroNexus-Bridging-Header.h
        OTHER_LDFLAGS: "-ObjC"
        CODE_SIGN_ENTITLEMENTS: Resources/REmu.entitlements
        DEVELOPMENT_TEAM: ""  # ← Kendi Apple Developer Team ID'ni buraya koy
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: GameController.framework
      - sdk: AVFoundation.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      # Libretro cores routinely depend on OpenGLES (3D rendering) and
      # AudioToolbox (audio queues). They aren't used by REmu's own Swift
      # code, but a core's dlopen will fail at runtime if these symbols
      # aren't already resident in the process. snes9x doesn't need them,
      # but mupen64plus_next, ppsspp, dolphin, pcsx2, and almost every
      # 3D-capable libretro core does.
      - sdk: OpenGLES.framework
      - sdk: AudioToolbox.framework
    postBuildScripts:
      - name: "Embed and Sign Libretro Cores"
        runOnlyWhenInstalling: false
        shell: /bin/bash
        # Declaring explicit inputs/outputs lets Xcode skip this script when
        # nothing changed — silences the "will run during every build" warning.
        # Add a matching pair for each new core dylib you drop into Resources/Cores.
        inputFiles:
          - $(SRCROOT)/Resources/Cores/snes9x_libretro_ios.dylib
          - $(SRCROOT)/Resources/Cores/mupen64plus_next_libretro_ios.dylib
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/snes9x_libretro_ios.dylib
          - $(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/mupen64plus_next_libretro_ios.dylib
        script: |
          set -e
          SRC_DIR="${SRCROOT}/Resources/Cores"
          DEST_DIR="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}"

          if [ ! -d "$SRC_DIR" ]; then
            echo "warning: ${SRC_DIR} does not exist — no cores to embed"
            exit 0
          fi

          mkdir -p "$DEST_DIR"
          shopt -s nullglob
          dylibs=("$SRC_DIR"/*.dylib)

          if [ ${#dylibs[@]} -eq 0 ]; then
            echo "warning: no .dylib files in ${SRC_DIR}"
            exit 0
          fi

          for dylib in "${dylibs[@]}"; do
            name=$(basename "$dylib")
            echo "Embedding libretro core: $name"
            cp -f "$dylib" "$DEST_DIR/$name"

            if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && \
               [ "${EXPANDED_CODE_SIGN_IDENTITY}" != "-" ]; then
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
                ${OTHER_CODE_SIGN_FLAGS:-} \
                --timestamp=none \
                "$DEST_DIR/$name"
            else
              # Simulator / no-team builds — ad-hoc signature is enough to
              # let dlopen succeed on the device's developer-disk image.
              codesign --force --sign - "$DEST_DIR/$name"
            fi
          done
