# XcodeGen spec — run `xcodegen generate` to produce REmu.xcodeproj
# Install: brew install xcodegen

name: REmu
options:
  bundleIdPrefix: com.fatihkoca
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  # Base language is English; Resources/en.lproj + tr.lproj supply the
  # Localizable.strings tables. XcodeGen auto-detects the .lproj folders
  # under the Resources path and registers en + tr as known regions.
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"

targets:
  REmu:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          # The raw .dylib cores here are the SOURCE that make-core-frameworks.sh
          # wraps into CoreFrameworks/*.framework. They must NOT be copied into
          # the app as loose files — Apple rejects standalone .dylib files
          # (error 90171). They reach the app only as embedded frameworks (see
          # the framework dependencies below), so exclude the raw folder.
          - "Cores/**"
    resources:
      - path: Resources
        excludes:
          - "Cores/**"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: REmu
        CFBundleShortVersionString: "1.4.0"
        CFBundleVersion: "11"
        # 10-language UI. Declaring them here makes the App Store list the app
        # as available in each language and pins the base (development) language.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - tr
          - es
          - de
          - fr
          - ja
          - zh-Hans
          - hi
          - pt-BR
          - ru
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # No UIBackgroundModes — when the user backgrounds the app we want
        # iOS to auto-pause our AVAudioSession so the speaker stops cleanly.
        # Previously declaring "audio" kept the engine running and the user
        # heard the game music continue until they killed the app.
        CFBundleDocumentTypes:
          - CFBundleTypeName: "ROM File"
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.item
        UIApplicationSupportsIndirectInputEvents: true
        # Declares that REmu uses no proprietary or non-exempt encryption.
        # Without this key, every TestFlight upload pops a dialog asking
        # the same question. Setting it to false here skips the prompt
        # and is honest: REmu only uses Apple's HTTPS for the optional
        # cover-art lookup, which falls under Apple's standard exemption.
        ITSAppUsesNonExemptEncryption: false
        # Allows CADisplayLink to actually reach 120 Hz on ProMotion panels.
        # The emulator still paces the core at its native rate (~60), so game
        # speed is unaffected — this just unlocks panel headroom (and faster
        # cores in the future).
        CADisableMinimumFrameDurationOnPhone: true
        # Hide the status bar app-wide. The game canvas is full-bleed in
        # landscape and on iPad the system status bar drew device locale
        # text (Turkish day names etc.) over the top of our UI. Hiding it
        # keeps every screen — gameplay, library, settings, screenshots —
        # consistently clean across devices and locales.
        UIStatusBarHidden: true
    entitlements:
      path: Resources/REmu.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fatihkoca.REmu2026
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/RetroNexus-Bridging-Header.h
        OTHER_LDFLAGS: "-ObjC"
        CODE_SIGN_ENTITLEMENTS: Resources/REmu.entitlements
        DEVELOPMENT_TEAM: "H733JDPXFY"  # Fatih Koca — Apple Developer Program
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Keep this NO. REmu targets iOS 15, where the Swift runtime ships
        # with the OS, so the app must NOT embed its own copy. The libretro
        # cores ship as properly-wrapped .framework bundles embedded through
        # Xcode's standard pipeline, so no Swift back-deployment and no
        # SwiftSupport folder are required (the old 90426/90429 errors came
        # from raw .dylib files copied into the bundle after that pipeline ran).
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: GameController.framework
      - sdk: AVFoundation.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      # Libretro cores routinely depend on OpenGLES (3D rendering) and
      # AudioToolbox (audio queues). They aren't used by REmu's own Swift
      # code, but a core's dlopen will fail at runtime if these symbols
      # aren't already resident in the process. snes9x doesn't need them,
      # but mupen64plus_next, ppsspp, dolphin, pcsx2, and almost every
      # 3D-capable libretro core does.
      - sdk: OpenGLES.framework
      - sdk: AudioToolbox.framework
      # Libretro cores, wrapped as .framework bundles by ./make-core-frameworks.sh.
      # Apple's App Store validation forbids standalone .dylib files anywhere in
      # the bundle (error 90171), so each core ships inside a .framework. embed +
      # codeSign route them through Xcode's normal "Embed Frameworks" phase, which
      # places and signs them in REmu.app/Frameworks at the correct build stage
      # (before swift-stdlib-tool runs — this is what fixed the old 90426/90429).
      # At runtime CoreBridge.findCoreDylib() dlopen()s the framework binary by
      # absolute path. Regenerate after changing cores:
      #   ./fetch-cores.sh && ./make-core-frameworks.sh && xcodegen generate
      - framework: CoreFrameworks/snes9x_libretro_ios.framework
        embed: true
        codeSign: true
      - framework: CoreFrameworks/mgba_libretro_ios.framework
        embed: true
        codeSign: true
      - framework: CoreFrameworks/fceumm_libretro_ios.framework
        embed: true
        codeSign: true
      - framework: CoreFrameworks/genesis_plus_gx_libretro_ios.framework
        embed: true
        codeSign: true
      - framework: CoreFrameworks/mednafen_psx_libretro_ios.framework
        embed: true
        codeSign: true
      - framework: CoreFrameworks/mednafen_pce_fast_libretro_ios.framework
        embed: true
        codeSign: true
      - framework: CoreFrameworks/stella_libretro_ios.framework
        embed: true
        codeSign: true
      - framework: CoreFrameworks/mednafen_ngp_libretro_ios.framework
        embed: true
        codeSign: true
      - framework: CoreFrameworks/mednafen_wswan_libretro_ios.framework
        embed: true
        codeSign: true
